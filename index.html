<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Telefon Jebat</title>
<style>
:root{
  --page:#d8d3e2; --surface:#ffffff; --surface2:#f2f2f7; --text:#111114; --muted:#8a8a93;
  --line:#e2e2ea; --bubble:#e9e9ef; --bubbleText:#111114; --note:#fffdf4;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#0e0c14; --surface:#000000; --surface2:#1c1c1e; --text:#f2f2f7; --muted:#8e8e96;
    --line:#2c2c31; --bubble:#262629; --bubbleText:#f2f2f7; --note:#1c1c1e; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --page:#0e0c14; --surface:#000000; --surface2:#1c1c1e; --text:#f2f2f7; --muted:#8e8e96;
  --line:#2c2c31; --bubble:#262629; --bubbleText:#f2f2f7; --note:#1c1c1e; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none !important}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px); background:var(--page)}
body{margin:0; height:100%; background:var(--page); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Roboto,"Segoe UI",sans-serif;
  display:grid; place-items:center; -webkit-tap-highlight-color:transparent; overflow:hidden}
button{font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer}
button:focus-visible{outline:2px solid #7A86C8; outline-offset:2px; border-radius:8px}

.phone{position:relative; width:390px; height:min(844px, calc(100% - 32px)); border-radius:54px;
  border:11px solid #19171f; box-shadow:0 0 0 2px #3a3644, 0 30px 80px rgba(20,10,40,.35);
  overflow:hidden; background:#000; isolation:isolate}
@media (max-width:500px){
  body{place-items:stretch}
  .phone{width:100%; height:100%; border:0; border-radius:0; box-shadow:none}
}

/* wallpaper: six book spines under a night sky */
.wall{position:absolute; inset:0; background:
  radial-gradient(circle at 78% 16%, rgba(255,248,225,.95) 0 22px, rgba(255,248,225,.18) 23px 40px, transparent 41px),
  linear-gradient(180deg,#120f1e 0%,#221a36 48%,#3b2b4c 100%)}
.wall .stars{position:absolute; inset:0 0 40% 0; background-image:
  radial-gradient(1px 1px at 12% 20%, #fff8, transparent), radial-gradient(1px 1px at 30% 8%, #fff9, transparent),
  radial-gradient(1.5px 1.5px at 52% 26%, #fffa, transparent), radial-gradient(1px 1px at 64% 12%, #fff7, transparent),
  radial-gradient(1px 1px at 88% 34%, #fff8, transparent), radial-gradient(1px 1px at 22% 40%, #fff6, transparent),
  radial-gradient(1.5px 1.5px at 42% 46%, #fff8, transparent), radial-gradient(1px 1px at 8% 52%, #fff7, transparent)}
.spines{position:absolute; left:8%; right:8%; bottom:0; height:30%; display:flex; align-items:flex-end; gap:5px}
.spine{flex:1; border-radius:4px 4px 0 0; position:relative; box-shadow:inset -6px 0 0 rgba(0,0,0,.18)}
.spine::before,.spine::after{content:""; position:absolute; left:18%; right:18%; height:2px; background:#e8cf86; opacity:.75}
.spine::before{top:12%} .spine::after{top:calc(12% + 6px)}
.glad{position:absolute; right:14%; bottom:28%; width:70px; height:150px; opacity:.85}
.home-dim{position:absolute; inset:0; background:rgba(10,6,20,.35); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); opacity:0; transition:opacity .35s}
.phone.at-home .home-dim{opacity:1}

/* status bar */
.status{position:absolute; top:0; left:0; right:0; height:48px; z-index:50; display:flex; align-items:center;
  justify-content:space-between; padding:6px 30px 0; font-weight:600; font-size:15px; color:#fff; pointer-events:none; transition:color .2s}
.phone.in-app .status{color:var(--text)}
.status .icons{display:flex; gap:6px; align-items:center}
.status svg{fill:currentColor}

/* lock screen */
.lock{position:absolute; inset:0; z-index:20; color:#fff; display:flex; flex-direction:column; align-items:center;
  padding-top:86px; transition:transform .45s cubic-bezier(.3,.7,.2,1), opacity .45s}
.lock.gone{transform:translateY(-100%); opacity:0; pointer-events:none}
.lock .date{font-size:19px; font-weight:500; opacity:.9}
.lock .clock{font-size:88px; font-weight:700; letter-spacing:-2px; line-height:1; margin-top:2px; font-variant-numeric:tabular-nums}
.lock .notif{margin-top:26px; width:calc(100% - 28px); background:rgba(255,255,255,.16); backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px); border-radius:20px; padding:12px 14px; display:flex; gap:10px; text-align:left}
.lock .notif .ic{width:36px; height:36px; border-radius:9px; flex:none}
.lock .notif b{font-size:14px} .lock .notif p{margin:2px 0 0; font-size:14px; opacity:.92}
.lock .notif .t{font-size:12px; opacity:.7; margin-left:auto; flex:none}
.lock .open-hint{margin-top:auto; margin-bottom:46px; font-size:15px; opacity:.85; padding:10px 20px}

.pad{position:absolute; inset:0; z-index:30; display:flex; flex-direction:column; align-items:center; padding-top:90px;
  color:#fff; background:rgba(12,8,22,.55); backdrop-filter:blur(26px); -webkit-backdrop-filter:blur(26px);
  opacity:0; pointer-events:none; transition:opacity .25s}
.pad.show{opacity:1; pointer-events:auto}
.pad h2{font-size:20px; font-weight:500; margin:0}
.dots{display:flex; gap:20px; margin:22px 0 10px}
.dots i{width:13px; height:13px; border-radius:50%; border:1.5px solid #fff; transition:background .1s}
.dots i.on{background:#fff}
.dots.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-12px)}40%{transform:translateX(10px)}60%{transform:translateX(-7px)}80%{transform:translateX(4px)}}
.hint{font-size:13px; opacity:.7; min-height:18px; margin-bottom:26px; text-align:center; padding:0 30px}
.keys{display:grid; grid-template-columns:repeat(3,78px); gap:16px 26px}
.key{width:78px; height:78px; border-radius:50%; background:rgba(255,255,255,.16); display:flex; flex-direction:column;
  align-items:center; justify-content:center; font-size:34px; font-weight:400; line-height:1}
.key small{font-size:10px; letter-spacing:2px; font-weight:600; margin-top:2px; opacity:.85}
.key:active{background:rgba(255,255,255,.4)}
.pad .cancel{margin-top:auto; margin-bottom:44px; font-size:16px; align-self:flex-end; margin-right:48px}

/* home */
.home{position:absolute; inset:0; z-index:10; padding:70px 22px 0; display:flex; flex-direction:column}
.home{opacity:0; pointer-events:none; transition:opacity .35s .1s}
.phone.at-home .home{opacity:1; pointer-events:auto}
.grid{display:grid; grid-template-columns:repeat(4,1fr); gap:24px 0; justify-items:center}
.app{display:flex; flex-direction:column; align-items:center; gap:6px; color:#fff; font-size:12px; width:72px}
.app .ic{width:60px; height:60px; border-radius:15px; display:grid; place-items:center; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,.25)}
.app:active .ic{filter:brightness(.8)}
.widget{grid-column:span 4; width:100%; border-radius:22px; padding:16px 18px; color:#fff; margin-bottom:4px;
  background:rgba(255,255,255,.14); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px)}
.widget .q{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif; font-size:16px; line-height:1.45; font-style:italic}
.widget .src{font-size:12px; opacity:.7; margin-top:8px}
.dock{margin-top:auto; margin-bottom:12px; display:flex; justify-content:space-around; padding:14px 6px; border-radius:30px;
  background:rgba(255,255,255,.18); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px)}
.dock .app > span:last-child{display:none}

/* app views */
.views{position:absolute; inset:0; z-index:40; pointer-events:none}
.view{position:absolute; inset:0; background:var(--surface); color:var(--text); display:flex; flex-direction:column;
  pointer-events:auto; transform:translateX(100%); transition:transform .32s cubic-bezier(.3,.7,.2,1)}
.view.from-home{transform:scale(.88); opacity:0; transition:transform .3s cubic-bezier(.3,.7,.2,1), opacity .25s}
.view.in{transform:none; opacity:1}
.view.under{transform:translateX(-28%)}
.nav{flex:none; padding:52px 12px 6px; display:flex; align-items:center; min-height:96px; position:relative;
  border-bottom:.5px solid var(--line); background:color-mix(in srgb, var(--surface) 88%, transparent)}
.nav .back{color:#2f7cf6; font-size:17px; display:flex; align-items:center; gap:2px; padding:8px 4px; z-index:1}
.nav .back svg{width:12px; height:20px}
.nav .mid{position:absolute; left:70px; right:70px; bottom:6px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:3px}
.nav .mid .nm{font-size:12px; color:var(--text)} .nav .mid .sub{font-size:11px; color:var(--muted)}
.big-title{font-size:34px; font-weight:700; padding:6px 18px 10px; letter-spacing:.3px}
.scroll{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch}
.homebar{position:absolute; bottom:8px; left:50%; transform:translateX(-50%); width:134px; height:5px; border-radius:3px;
  background:#fff; z-index:60; opacity:.9}
.phone.in-app .homebar{background:var(--text)}
.homebar-hit{position:absolute; bottom:0; left:50%; transform:translateX(-50%); width:200px; height:26px; z-index:61}

/* message list */
.row-item{display:flex; gap:12px; align-items:center; padding:10px 16px; width:100%; text-align:left}
.row-item .body{flex:1; min-width:0; border-bottom:.5px solid var(--line); padding-bottom:12px}
.row-item .top{display:flex; justify-content:space-between; gap:8px}
.row-item b{font-size:16px; font-weight:600}
.row-item .tm{font-size:14px; color:var(--muted); flex:none}
.row-item p{margin:3px 0 0; font-size:14px; color:var(--muted); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; line-height:1.3}
.av{border-radius:50%; display:grid; place-items:center; font-weight:600; flex:none}
.av.dark{box-shadow:inset 0 0 0 1.5px #77727f}
.gav{width:52px; height:52px; border-radius:50%; background:var(--surface2); display:grid; grid-template-columns:repeat(3,12px); gap:3px; place-content:center; flex:none}
.gav.sm{width:30px; height:30px; grid-template-columns:repeat(3,6px); gap:2px}
.gav i{width:12px; height:12px; border-radius:50%}
.gav.sm i{width:6px; height:6px}

/* chat */
.chat{padding:10px 12px 16px; display:flex; flex-direction:column}
.day{align-self:center; font-size:12px; color:var(--muted); margin:14px 0 8px; font-weight:500}
.msg{display:flex; align-items:flex-end; gap:6px; margin-top:2px; max-width:100%}
.msg.mine{justify-content:flex-end}
.msg.gap{margin-top:9px}
.msg .sp{width:28px; flex:none}
.bw{display:flex; flex-direction:column; max-width:74%}
.msg.mine .bw{align-items:flex-end}
.who{font-size:11px; color:var(--muted); margin:0 0 2px 12px}
.bubble{padding:8px 13px; border-radius:19px; font-size:16px; line-height:1.3; background:var(--bubble); color:var(--bubbleText);
  white-space:pre-wrap; overflow-wrap:anywhere}
.msg.mine .bubble{border-bottom-right-radius:19px; box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.msg.last.mine .bubble{border-bottom-right-radius:5px}
.msg.last.theirs .bubble{border-bottom-left-radius:5px}
.bubble.emoji{background:none !important; font-size:40px; padding:0 2px; line-height:1.1}
.receipt{align-self:flex-end; font-size:11px; color:var(--muted); margin:3px 4px 0}
.composer{flex:none; display:flex; gap:8px; align-items:center; padding:8px 12px 30px; border-top:.5px solid var(--line)}
.composer .plus{width:34px; height:34px; border-radius:50%; background:var(--surface2); display:grid; place-items:center; color:var(--muted); font-size:22px}
.composer .field{flex:1; border:1px solid var(--line); border-radius:18px; padding:7px 14px; color:var(--muted); font-size:16px}

/* notes */
.view.notes{background:var(--surface2)}
.group{margin:0 16px 16px; background:var(--surface); border-radius:12px; overflow:hidden}
.note-row{display:block; width:100%; text-align:left; padding:11px 16px; border-bottom:.5px solid var(--line)}
.note-row:last-child{border-bottom:0}
.note-row b{font-size:16px; display:block}
.note-row span{font-size:14px; color:var(--muted)}
.note-body{padding:6px 20px 40px; background:var(--note); min-height:100%}
.note-body .when{font-size:13px; color:var(--muted); text-align:center; margin:4px 0 14px}
.note-body h1{font-size:26px; margin:0 0 12px}
.note-body p{font-size:17px; line-height:1.5; white-space:pre-wrap; margin:0}

/* gallery */
.photos{display:grid; grid-template-columns:repeat(3,1fr); gap:2px}
.ph{aspect-ratio:1; background-size:cover; background-position:center; position:relative}
.viewer{flex:1; display:flex; flex-direction:column; justify-content:center; background:#000}
.viewer .img{aspect-ratio:3/4; width:100%; background-size:cover; background-position:center}
.viewer .cap{color:#fff; padding:16px 20px; font-size:15px; line-height:1.4}
.viewer .cap small{display:block; color:#aaa; margin-top:4px}
.view.dark{background:#000}
.view.dark .nav{background:#000; border-color:#222}

/* calendar */
.cal-head{padding:0 18px 8px; color:#e0443e; font-size:17px; font-weight:600}
.week{display:grid; grid-template-columns:repeat(7,1fr); text-align:center; padding:0 10px 12px; border-bottom:.5px solid var(--line)}
.week .dn{font-size:11px; color:var(--muted); margin-bottom:6px}
.week .dd{width:34px; height:34px; margin:auto; border-radius:50%; display:grid; place-items:center; font-size:18px}
.week .dd.today{background:#e0443e; color:#fff; font-weight:600}
.ev{display:flex; gap:12px; padding:12px 18px; border-bottom:.5px solid var(--line)}
.ev .bar{width:4px; border-radius:2px; flex:none}
.ev .w{font-size:13px; color:var(--muted); margin-bottom:2px}
.ev b{font-size:16px; font-weight:600}

.toast{position:absolute; left:50%; top:62px; transform:translate(-50%,-20px); z-index:70; background:rgba(30,28,36,.9); color:#fff;
  font-size:14px; padding:10px 16px; border-radius:14px; opacity:0; transition:.25s; pointer-events:none; white-space:nowrap}
.toast.show{opacity:1; transform:translate(-50%,0)}


/* pictures */
.av{position:relative; overflow:hidden}
.av img,.ph img,.viewer .img img,.wall-img img,.bubble.pic img,.note-img img,.lightbox .lb-img img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
.ph{overflow:hidden}
.viewer .img{position:relative; overflow:hidden}
.viewer .img.has{aspect-ratio:auto; height:70%}
.viewer .img.has img{object-fit:contain; background:#000}
.wall-img{position:absolute; inset:0; z-index:3; background:#000}
.bubble.pic{position:relative; width:210px; height:260px; padding:0; overflow:hidden; background:var(--bubble); display:block}
.bubble.pic .missing{position:absolute; inset:0; display:grid; place-items:center; font-size:30px; opacity:.4}
.bubble.pic img{z-index:1}
.note-img{position:relative; margin-top:18px; width:100%; aspect-ratio:4/3; border-radius:12px; overflow:hidden; background:var(--line)}
.lightbox{position:absolute; inset:0; z-index:80; background:#000; display:none; align-items:center; justify-content:center}
.lightbox.show{display:flex}
.lightbox .lb-img{position:relative; width:100%; height:80%}
.lightbox .lb-img img{object-fit:contain}
.lightbox .lb-close{position:absolute; top:56px; left:16px; color:#fff; font-size:17px}
/* lock button on home */
.home-mini{margin-top:auto}
.home-mini:not([hidden]) + .lock-btn{margin-top:0}
.lock-btn{align-self:center; margin-top:auto; margin-bottom:12px; display:flex; align-items:center; gap:6px; color:#fff; font-size:13px;
  padding:7px 14px; border-radius:16px; background:rgba(255,255,255,.16); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px)}
.lock-btn + .dock{margin-top:0}
.key.del{background:none; font-size:24px}


/* ---------- shared ---------- */
.ib{display:inline-grid; place-items:center; width:40px; height:40px; color:inherit; border-radius:10px}
.ib svg{width:25px; height:25px; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round}
.ib.sm{width:28px; height:28px} .ib.sm svg{width:14px; height:14px}
.ib.like.on svg,.pv-fav.on svg,.sv-like.on svg{fill:#ed4956; stroke:#ed4956}
.ib.save.on svg{fill:currentColor}
.ib:active{transform:scale(.9)}
.sp1{flex:1}
.b{font-weight:600; color:inherit}
.mention{color:#4f8ef7; font-weight:500}
.empty{padding:40px 20px; text-align:center; color:var(--muted); font-size:14px}
.nav-r{position:absolute; right:10px; bottom:6px; z-index:1}
.nav .mid .nm b{font-size:16px}

.sheet{position:absolute; inset:0; z-index:75; background:rgba(0,0,0,.35); display:flex; align-items:flex-end; opacity:0; pointer-events:none; transition:opacity .2s}
.sheet.show{opacity:1; pointer-events:auto}
.sheet-card{width:100%; max-height:78%; overflow-y:auto; background:var(--surface); color:var(--text); border-radius:16px 16px 0 0; padding:8px 0 30px;
  transform:translateY(30px); transition:transform .25s}
.sheet.show .sheet-card{transform:none}
.sheet-card::before{content:""; display:block; width:38px; height:5px; border-radius:3px; background:var(--line); margin:4px auto 10px}
.sh-title{text-align:center; font-weight:600; font-size:16px; padding:0 16px 10px; border-bottom:.5px solid var(--line); margin-bottom:6px}
.sh-btn,.sh-cancel{display:block; width:100%; padding:14px 18px; font-size:16px; text-align:left; border-top:.5px solid var(--line)}
.sh-btn.red{color:#ed4956}
.sh-cancel{text-align:center; font-weight:600}
.sh-text{padding:6px 18px 12px; font-size:15px; line-height:1.5}
.sh-text small{display:block; color:var(--muted); font-size:13px}
.sh-area{display:block; width:calc(100% - 32px); margin:4px 16px 12px; min-height:90px; border:1px solid var(--line); border-radius:10px; padding:10px; font:inherit; font-size:15px; background:var(--surface2); color:var(--text); resize:vertical}

/* ---------- Lensa ---------- */
.view.ig{background:var(--surface)}
.ig-top{flex:none; display:flex; align-items:center; gap:2px; padding:50px 6px 4px 8px; border-bottom:.5px solid var(--line)}
.ig-top .back{padding:8px 2px}
.ig-logo{font-family:"Snell Roundhand","Brush Script MT","Segoe Script",cursive; font-size:28px; margin-left:4px; line-height:1}
.ig-tabs{flex:none; display:flex; justify-content:space-around; align-items:center; padding:6px 0 30px; border-top:.5px solid var(--line); background:var(--surface)}
.ig-tabs button{width:48px; height:40px; display:grid; place-items:center; opacity:.55}
.ig-tabs button.on{opacity:1}
.ig-tabs svg{width:26px; height:26px; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round}
.ig-tabs button.on svg{stroke-width:2.6}

.ring{display:inline-grid; place-items:center; border-radius:50%; background:conic-gradient(from 200deg,#C9A13B,#B3262E,#6B3A7D,#8C97D4,#C9A13B); flex:none}
.ring > .av{box-shadow:0 0 0 2px var(--surface)}
.ring.seen{background:var(--line)}
.tray{display:flex; gap:12px; padding:10px 12px 12px; overflow-x:auto; border-bottom:.5px solid var(--line); scrollbar-width:none}
.tray::-webkit-scrollbar{display:none}
.st{display:flex; flex-direction:column; align-items:center; gap:4px; width:68px; flex:none; position:relative}
.st > span:last-child{font-size:11px; max-width:68px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.st .plus{position:absolute; right:4px; top:44px; width:20px; height:20px; border-radius:50%; background:#4f8ef7; color:#fff; font-size:16px; line-height:18px; border:2px solid var(--surface)}

.post{border-bottom:.5px solid var(--line); padding-bottom:10px}
.phd{display:flex; align-items:center; padding:8px 6px 8px 12px}
.phd .pwho{display:flex; align-items:center; gap:9px; text-align:left; flex:1; min-width:0}
.phd .pwho b{font-size:14px; display:block}
.phd .pwho small{font-size:12px; color:var(--muted)}
.phd .ib svg{width:20px; height:20px}
.media{position:relative; width:100%; aspect-ratio:1; overflow:hidden; user-select:none; -webkit-user-select:none; cursor:pointer}
.media img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
.burst{position:absolute; left:50%; top:50%; width:96px; height:96px; margin:-48px 0 0 -48px; opacity:0; transform:scale(.3); pointer-events:none; z-index:2}
.burst svg{width:100%; height:100%; fill:#fff; stroke:none; filter:drop-shadow(0 4px 12px rgba(0,0,0,.3))}
.burst.pop{animation:pop .8s ease-out}
@keyframes pop{15%{opacity:.95; transform:scale(1.15)}30%{transform:scale(.95)}45%{transform:scale(1)}80%{opacity:.95}100%{opacity:0; transform:scale(1)}}
.acts{display:flex; align-items:center; padding:2px 4px 0}
.likes{font-size:14px; padding:2px 13px 4px}
.cap,.cprev{font-size:14px; line-height:1.4; padding:0 13px 3px; overflow-wrap:anywhere}
.viewc{font-size:14px; color:var(--muted); padding:2px 13px 4px; display:block}
.ptime{font-size:11px; color:var(--muted); padding:4px 13px 0}

.ig-search{padding:8px 12px}
.ig-search input{width:100%; border:0; border-radius:10px; padding:9px 12px; font:inherit; font-size:16px; background:var(--surface2); color:var(--text)}
.grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:2px}
.tile{aspect-ratio:1; position:relative; overflow:hidden}
.tile img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
.tile.sel{outline:3px solid #4f8ef7; outline-offset:-3px}
.urow{display:flex; align-items:center; gap:10px; padding:8px 14px}
.uinfo{display:flex; align-items:center; gap:11px; flex:1; min-width:0; text-align:left}
.uinfo b{font-size:14px; display:block}
.uinfo small{font-size:13px; color:var(--muted)}
.fbtn{background:#4f8ef7; color:#fff; font-weight:600; font-size:13px; padding:7px 16px; border-radius:8px; flex:none}
.fbtn.ghost{background:var(--surface2); color:var(--text)}
.fbtn[disabled]{opacity:.6}
.more-note{padding:10px 14px 30px; font-size:13px; color:var(--muted)}

.prof{padding:10px 0 0}
.prow{display:flex; align-items:center; gap:18px; padding:4px 16px 10px}
.stats{flex:1; display:flex; justify-content:space-around; text-align:center}
.stats b{display:block; font-size:17px}
.stats span{font-size:12px; color:var(--muted)}
.pname{font-weight:600; font-size:14px; padding:0 16px}
.pbio{font-size:14px; line-height:1.4; padding:2px 16px 0; white-space:pre-wrap}
.pbtns{display:flex; gap:6px; padding:12px 16px}
.gbtn{flex:1; background:var(--surface2); border-radius:8px; padding:8px; font-size:14px; font-weight:600}
.gbtn.blue{background:#4f8ef7; color:#fff}
.hls{display:flex; gap:14px; padding:4px 16px 12px; overflow-x:auto}
.hls button{display:flex; flex-direction:column; align-items:center; gap:4px; flex:none}
.hl{width:62px; height:62px; border-radius:50%; position:relative; overflow:hidden; box-shadow:0 0 0 2px var(--surface), 0 0 0 3px var(--line)}
.hl img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
.hls small{font-size:11px}
.ptabs{display:flex; border-top:.5px solid var(--line)}
.ptabs button{flex:1; padding:10px; display:grid; place-items:center; opacity:.45; border-bottom:1.5px solid transparent}
.ptabs button.on{opacity:1; border-bottom-color:var(--text)}
.ptabs svg{width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:1.9}
.prof-menu{position:absolute; right:12px; top:8px}

.clist{padding:6px 0 10px}
.crow{display:flex; gap:10px; padding:9px 12px; align-items:flex-start}
.cbody{flex:1; font-size:14px; line-height:1.4; overflow-wrap:anywhere}
.cmeta{font-size:12px; color:var(--muted); margin-top:4px}
.cmeta button{font-weight:600; color:var(--muted)}
.cbox,.dmbox{flex:none; display:flex; align-items:center; gap:10px; padding:8px 12px 30px; border-top:.5px solid var(--line)}
.cbox input,.dmbox input{flex:1; min-width:0; border:1px solid var(--line); border-radius:20px; padding:9px 14px; font:inherit; font-size:16px; background:var(--surface); color:var(--text)}
.post-btn{color:#4f8ef7; font-weight:600; font-size:15px}
.dm-empty{display:flex; flex-direction:column; align-items:center; gap:6px; padding:30px 0 10px; text-align:center}
.dm-empty b{font-size:17px}
.dm-empty small{color:var(--muted); font-size:13px}
.dm-empty .gbtn{flex:none; padding:7px 14px; margin-top:6px}
.act-row{display:flex; align-items:center; gap:10px; padding:8px 12px; width:100%; text-align:left}
.act-row .tx{flex:1; font-size:14px; line-height:1.35}
.act-row .tx small{color:var(--muted)}
.act-row .th{width:44px; height:44px; flex:none; position:relative; overflow:hidden; border-radius:4px}
.act-row .th img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
.sect{font-weight:700; font-size:16px; padding:14px 14px 4px}

.cmp-prev{width:100%; aspect-ratio:1; position:relative; overflow:hidden}
.cmp-prev img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
.cmp-cap{display:block; width:100%; border:0; border-bottom:.5px solid var(--line); padding:14px; font:inherit; font-size:16px; min-height:80px; background:var(--surface); color:var(--text); resize:none}
.cmp-lbl{font-weight:600; font-size:14px; padding:12px 14px 8px}
.share-btn{color:#4f8ef7; font-weight:600; font-size:16px; padding:8px}

/* stories */
.view.story-view{background:#000; color:#fff}
.sv{position:absolute; inset:0; display:flex; flex-direction:column; background:#000}
.sv-bars{display:flex; gap:3px; padding:50px 10px 0}
.sv-bars i{flex:1; height:2.5px; border-radius:2px; background:rgba(255,255,255,.35); overflow:hidden}
.sv-bars i b{display:block; height:100%; width:0; background:#fff}
.sv-bars i.done b{width:100%}
.sv-bars i.run b{animation:fill 5s linear forwards}
@keyframes fill{to{width:100%}}
.sv-head{display:flex; align-items:center; gap:8px; padding:10px 6px 8px 12px; z-index:2}
.sv-head b{font-size:14px} .sv-head small{font-size:13px; opacity:.7}
.sv-media{flex:1; position:relative; overflow:hidden; border-radius:10px; margin:0 4px; display:grid; place-items:center}
.sv-media img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
.sv-text{position:relative; z-index:1; font-size:24px; font-weight:700; text-align:center; padding:0 26px; line-height:1.3; text-shadow:0 2px 12px rgba(0,0,0,.45); white-space:pre-wrap}
.sv-prev,.sv-next{position:absolute; top:110px; bottom:100px; width:35%; z-index:1}
.sv-prev{left:0} .sv-next{right:0; width:65%}
.sv-foot{display:flex; align-items:center; gap:8px; padding:10px 10px 30px; z-index:2}
.sv-foot input{flex:1; min-width:0; background:transparent; border:1px solid rgba(255,255,255,.5); border-radius:22px; padding:10px 16px; font:inherit; font-size:16px; color:#fff}
.sv-foot input::placeholder{color:rgba(255,255,255,.75)}
.sv-own{font-size:13px; opacity:.75; padding:10px 6px}

/* ---------- Galeri ---------- */
.seg{display:flex; gap:6px; padding:0 16px 12px}
.seg button{padding:6px 14px; border-radius:16px; background:var(--surface2); font-size:14px; font-weight:500}
.seg button.on{background:var(--text); color:var(--surface)}
.ph .fav-dot{position:absolute; left:6px; bottom:4px; color:#fff; font-size:14px; text-shadow:0 1px 4px rgba(0,0,0,.5); z-index:2}
.pv-stage{position:relative; flex:1; display:flex; align-items:center; overflow:hidden}
.pv-stage .img{width:100%; aspect-ratio:3/4; position:relative; overflow:hidden}
.pv-stage .img img{position:absolute; inset:0; width:100%; height:100%; object-fit:contain; background:#000}
.pv-arrow{position:absolute; top:50%; margin-top:-22px; width:44px; height:44px; border-radius:50%; background:rgba(0,0,0,.35); color:#fff; font-size:30px; line-height:40px; z-index:2}
.pv-arrow.l{left:8px} .pv-arrow.r{right:8px}
.pv-bar{display:flex; justify-content:space-around; padding:6px 0 30px; color:#fff}
.view.dark .viewer{flex:1}

/* ---------- Muzik ---------- */
.view.music{background:var(--surface)}
.pl-card{margin:0 16px 14px; border-radius:16px; padding:18px; color:#fff; position:relative; overflow:hidden}
.pl-card small{font-size:12px; opacity:.8; letter-spacing:1px; font-weight:600}
.pl-card h3{font-size:24px; margin:4px 0 2px}
.pl-card p{font-size:13px; opacity:.85}
.pl-btns{display:flex; gap:8px; margin-top:14px}
.pl-btns button,.pl-btns a{flex:1; display:flex; align-items:center; justify-content:center; gap:6px; background:rgba(255,255,255,.2); color:#fff; border-radius:10px; padding:9px; font-size:14px; font-weight:600; text-decoration:none}
.pl-btns svg{width:16px; height:16px; fill:currentColor}
.song{display:flex; align-items:center; gap:12px; padding:7px 16px; width:100%; text-align:left}
.song .th{width:52px; height:52px; border-radius:8px; flex:none; position:relative; overflow:hidden}
.song .th img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
.song .tx{flex:1; min-width:0; border-bottom:.5px solid var(--line); padding:6px 0 12px}
.song b{display:block; font-size:15px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.song small{font-size:13px; color:var(--muted)}
.song.now b{color:#fa2d48}
.song.off{opacity:.5}
.eq{display:inline-flex; gap:2px; align-items:flex-end; height:12px; margin-right:6px}
.eq i{width:3px; background:#fa2d48; animation:eq .9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.2s} .eq i:nth-child(3){animation-delay:.4s}
@keyframes eq{0%,100%{height:3px}50%{height:12px}}
.chan{display:flex; align-items:center; gap:10px; margin:14px 16px 20px; padding:12px 14px; border-radius:12px; background:var(--surface2); text-decoration:none; color:var(--text); font-size:15px; font-weight:500}
.chan .yt{width:30px; height:21px; border-radius:6px; background:#ff0033; display:grid; place-items:center; flex:none}
.chan .yt svg{width:10px; height:10px; fill:#fff}
.mini{display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:14px; background:color-mix(in srgb, var(--surface2) 92%, transparent); color:var(--text); box-shadow:0 4px 18px rgba(0,0,0,.15); width:100%; text-align:left}
.mini[hidden]{display:none}
.mini .th{width:40px; height:40px; border-radius:7px; position:relative; overflow:hidden; flex:none}
.mini .th img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
.mini .tx{flex:1; min-width:0}
.mini b{display:block; font-size:14px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.mini small{font-size:12px; color:var(--muted)}
.mini .ib svg{fill:currentColor; stroke:none; width:22px; height:22px}
.music-mini{flex:none; padding:8px 12px 30px; border-top:.5px solid var(--line)}
.home-mini{margin:auto 0 10px}
.home-mini .mini{background:rgba(255,255,255,.2); color:#fff; backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px)}
.home-mini .mini small{color:rgba(255,255,255,.75)}
.np-art{margin:24px 20px 0; aspect-ratio:16/9; border-radius:14px; position:relative; overflow:hidden; display:grid; place-items:center; color:#fff; font-size:13px; text-align:center}
.np-art img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; filter:brightness(.6)}
.np-art span{position:relative; padding:0 20px}
.np-info{padding:22px 24px 6px}
.np-info b{display:block; font-size:21px}
.np-info small{font-size:16px; color:var(--muted)}
.np-bar{margin:14px 24px 4px; height:5px; border-radius:3px; background:var(--line); position:relative; cursor:pointer}
.np-bar i{position:absolute; left:0; top:0; bottom:0; border-radius:3px; background:var(--text); width:0}
.np-times{display:flex; justify-content:space-between; font-size:12px; color:var(--muted); margin:0 24px; font-variant-numeric:tabular-nums}
.np-ctl{display:flex; justify-content:center; align-items:center; gap:34px; padding:18px 0}
.np-ctl button svg{fill:currentColor; width:34px; height:34px}
.np-ctl .big svg{width:56px; height:56px}
.np-links{display:flex; gap:10px; padding:0 24px 30px}
.np-links a{flex:1; text-align:center; padding:11px; border-radius:10px; background:var(--surface2); color:var(--text); text-decoration:none; font-size:14px; font-weight:600}
.yt-host{position:absolute; z-index:42; left:20px; right:20px; top:120px; aspect-ratio:16/9; border-radius:14px; overflow:hidden; background:#000}
.yt-host iframe{width:100%; height:100%; border:0; display:block}
.phone:not(.np-open) .yt-host{left:-9999px; right:auto; width:240px}

/* ---------- Phone app ---------- */
.app{position:relative}
.badge{position:absolute; top:-6px; right:0; min-width:22px; height:22px; padding:0 6px; border-radius:11px; background:#ff3b30; color:#fff; font-size:13px; font-weight:600; display:grid; place-items:center; z-index:2; box-shadow:0 0 0 1px rgba(0,0,0,.08)}
.view.tel{background:var(--surface)}
.tel-tabs{flex:none; display:flex; justify-content:space-around; padding:6px 0 28px; border-top:.5px solid var(--line); background:color-mix(in srgb, var(--surface) 92%, transparent)}
.tel-tabs button{display:flex; flex-direction:column; align-items:center; gap:2px; font-size:10px; color:var(--muted); width:64px; position:relative}
.tel-tabs button.on{color:#007aff}
.tel-tabs svg{width:26px; height:26px; fill:currentColor}
.tel-tabs .badge{top:-4px; right:8px; min-width:18px; height:18px; font-size:11px}
.trow{display:flex; align-items:center; gap:12px; padding:8px 8px 8px 16px; width:100%; text-align:left}
.trow .tx{flex:1; min-width:0; border-bottom:.5px solid var(--line); padding:4px 0 10px; display:flex; align-items:center; gap:8px}
.trow .nm{flex:1; min-width:0}
.trow b{display:block; font-size:16px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.trow b.miss{color:#ff3b30}
.trow small{font-size:13px; color:var(--muted); display:flex; align-items:center; gap:4px}
.trow small svg{width:12px; height:12px; fill:var(--muted)}
.trow .when{font-size:14px; color:var(--muted); flex:none}
.info{width:26px; height:26px; border-radius:50%; border:1.5px solid #007aff; color:#007aff; font:italic 600 14px Georgia, serif; display:grid; place-items:center; flex:none}
.seg2{display:flex; margin:0 16px 10px; background:var(--surface2); border-radius:9px; padding:2px}
.seg2 button{flex:1; padding:6px; border-radius:7px; font-size:13px; font-weight:600}
.seg2 button.on{background:var(--surface); box-shadow:0 1px 3px rgba(0,0,0,.12)}
.letter{font-size:13px; font-weight:600; color:var(--muted); padding:10px 16px 2px; background:var(--surface2)}
.mycard{display:flex; align-items:center; gap:14px; padding:6px 16px 14px; border-bottom:.5px solid var(--line); width:100%; text-align:left}
.mycard b{font-size:20px; display:block} .mycard small{color:var(--muted); font-size:13px}
.kp{display:flex; flex-direction:column; align-items:center; padding-top:20px}
.kp-num{font-size:34px; height:46px; letter-spacing:1px; min-width:10px; text-align:center; font-variant-numeric:tabular-nums}
.kp-grid{display:grid; grid-template-columns:repeat(3,78px); gap:14px 26px; margin-top:16px}
.kp-grid button{width:78px; height:78px; border-radius:50%; background:var(--surface2); display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:32px; line-height:1}
.kp-grid button small{font-size:10px; letter-spacing:2px; font-weight:600; margin-top:2px}
.kp-grid button:active{filter:brightness(.85)}
.kp-row{display:grid; grid-template-columns:repeat(3,78px); gap:26px; margin-top:16px; align-items:center}
.callbtn{width:78px; height:78px; border-radius:50%; background:#34c759; display:grid; place-items:center}
.callbtn svg{width:34px; height:34px; fill:#fff}
.kp-del{font-size:24px; color:var(--muted)}
.vm{border-bottom:.5px solid var(--line)}
.vm .trow .tx{border:0}
.vm-body{padding:0 16px 14px 16px}
.vm-t{font-size:14px; line-height:1.45; background:var(--surface2); border-radius:10px; padding:10px 12px; margin-bottom:10px}
.vm-t small{display:block; font-size:11px; color:var(--muted); font-weight:600; letter-spacing:.5px; margin-bottom:3px}
.vm-ctl{display:flex; align-items:center; gap:12px}
.vm-play{width:34px; height:34px; border-radius:50%; background:#007aff; display:grid; place-items:center; flex:none}
.vm-play svg{width:14px; height:14px; fill:#fff}
.vm-bar{flex:1; height:4px; border-radius:2px; background:var(--line); position:relative}
.vm-bar i{position:absolute; left:0; top:0; bottom:0; width:0; border-radius:2px; background:#007aff}
.vm-time{font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; width:34px; text-align:right}
.vm-acts{display:flex; gap:18px; margin-top:12px}
.vm-acts button{color:#007aff; font-size:15px}
.vm-acts button.red{color:#ff3b30}
.ccard{display:flex; flex-direction:column; align-items:center; padding:10px 16px 0}
.ccard h3{font-size:28px; font-weight:400; margin:10px 0 14px}
.cacts{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; width:100%; margin-bottom:14px}
.cacts button{background:var(--surface2); border-radius:12px; padding:9px 0 7px; display:flex; flex-direction:column; align-items:center; gap:3px; color:#007aff; font-size:11px}
.cacts svg{width:22px; height:22px; fill:#007aff}
.cfield{width:100%; background:var(--surface2); border-radius:12px; padding:10px 14px; margin-bottom:10px; text-align:left}
.cfield small{display:block; font-size:13px; color:var(--text)} .cfield span{color:#007aff; font-size:16px}
.cfield p{font-size:15px; line-height:1.4; white-space:pre-wrap}
.view.call{background:linear-gradient(170deg,#3a3550,#14111d 70%); color:#fff}
.call-top{display:flex; flex-direction:column; align-items:center; padding-top:90px}
.call-top h3{font-size:32px; font-weight:400; margin-top:16px}
.call-top p{font-size:17px; opacity:.7; margin-top:4px}
.call-grid{display:grid; grid-template-columns:repeat(3,76px); gap:22px 30px; justify-content:center; margin-top:auto}
.call-grid button{display:flex; flex-direction:column; align-items:center; gap:7px; font-size:12px}
.call-grid span{width:76px; height:76px; border-radius:50%; background:rgba(255,255,255,.16); display:grid; place-items:center; backdrop-filter:blur(10px)}
.call-grid svg{width:30px; height:30px; fill:#fff}
.call-grid button.on span{background:#fff} .call-grid button.on svg{fill:#111}
.endbtn{width:76px; height:76px; border-radius:50%; background:#ff3b30; display:grid; place-items:center; margin:34px auto 50px}
.endbtn svg{width:34px; height:34px; fill:#fff; transform:rotate(135deg)}
.call-kp{display:none; grid-template-columns:repeat(3,70px); gap:12px 24px; justify-content:center; margin-top:auto}
.call-kp button{width:70px; height:70px; border-radius:50%; background:rgba(255,255,255,.16); font-size:28px}
.view.call.kpon .call-grid{display:none} .view.call.kpon .call-kp{display:grid}
.ig-top .back{display:flex; align-items:center; gap:2px; color:#2f7cf6; font-size:17px; padding:8px 4px; flex:none}
.ig-top .back svg{width:12px; height:20px}
.ig-top .ig-logo{margin-left:10px; cursor:pointer}

@media (prefers-reduced-motion: reduce){ *,*::before,*::after{transition-duration:.01ms !important; animation-duration:.01ms !important} }
</style>
</head>

/* ---------- navigation ----------
   Screens stack up: lock > home > app > chat/note/photo.
   The on-screen back button, the phone's own back button/gesture,
   the browser back button and the Esc key all go back one screen. */
const stack = [];
let unlocked = false;
const depth = () => (unlocked ? 1 : 0) + stack.length;
function remember(){ try { history.pushState({ d: depth() }, ""); } catch (e) {} }
function goBack(){ if (depth() === 0) return; try { history.back(); } catch (e) { stepBack(); } }
window.addEventListener("popstate", e => {
  const target = (e.state && e.state.d) || 0;
  while (depth() > target) stepBack();
});
function stepBack(){
  if (stack.length) return popView();
  if (unlocked) lockPhone();
}

const letters = ["","ABC","DEF","GHI","JKL","MNO","PQRS","TUV","WXYZ"];
$("#keys").innerHTML = [1,2,3,4,5,6,7,8,9].map(n => `<button class="key" data-k="${n}">${n}<small>${letters[n-1]}</small></button>`).join("")
  + `<span></span><button class="key" data-k="0">0</button><button class="key del" data-k="del" aria-label="Delete">⌫</button>`;
$("#keys").addEventListener("click", e => {
  const k = e.target.closest(".key"); if (!k) return;
  if (k.dataset.k === "del"){ entered = entered.slice(0,-1); paintDots(); return; }
  if (entered.length >= 4) return;
  entered += k.dataset.k; paintDots();
  if (entered.length === 4) setTimeout(check, 120);
});
function paintDots(){ [...$("#dots").children].forEach((d,i) => d.classList.toggle("on", i < entered.length)); }
function check(){
  if (entered === PASSCODE){ entered = ""; paintDots(); unlockPhone(); }
  else { const d = $("#dots"); d.classList.add("shake"); $("#hint").textContent = PASSCODE_HINT;
    setTimeout(() => { d.classList.remove("shake"); entered=""; paintDots(); }, 420); }
}
const closePad = () => { $("#pad").classList.remove("show"); entered=""; paintDots(); };
$("#openHint").onclick = () => $("#pad").classList.add("show");
$("#lock").addEventListener("click", e => { if (!e.target.closest(".open-hint")) $("#pad").classList.add("show"); });
$("#cancel").onclick = closePad;
document.addEventListener("keydown", e => {
  if ($("#pad").classList.contains("show")){
    if (/^[0-9]$/.test(e.key) && entered.length < 4){ entered += e.key; paintDots(); if (entered.length===4) setTimeout(check,120); }
    if (e.key === "Backspace"){ entered = entered.slice(0,-1); paintDots(); }
    if (e.key === "Escape") closePad();
    return;
  }
  if (e.key === "Escape" && $("#sheet").classList.contains("show")){ closeSheet(); return; }
  if (e.key === "Escape" && !$("#lightbox").classList.contains("show")) goBack();
});

// toast
let tt;
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove("show"),1600); }

function push(html, opts = {}){
  const v = document.createElement("section");
  v.className = "view" + (opts.cls ? " " + opts.cls : "") + (stack.length ? "" : " from-home");
  v.innerHTML = html; $("#views").appendChild(v);
  if (stack.length) stack[stack.length-1].classList.add("under");
  stack.push(v); phone.classList.toggle("in-app", !opts.darkStatus);
  requestAnimationFrame(() => requestAnimationFrame(() => v.classList.add("in")));
  v.querySelectorAll("[data-back]").forEach(b => b.onclick = goBack);
  if (opts.after) opts.after(v);
  remember(); syncChrome();
  return v;
}
function popView(){
  const v = stack.pop(); if (!v) return;
  if (v._onClose) v._onClose();
  v.classList.remove("in");
  if (stack.length){ const top = stack[stack.length-1]; top.classList.remove("under"); phone.classList.toggle("in-app", !top.classList.contains("dark")); }
  else phone.classList.remove("in-app");
  syncChrome();
  setTimeout(() => v.remove(), 340);
}
function goHome(){ if (stack.length){ try { history.go(-stack.length); } catch (e) { while (stack.length) popView(); } } }
$("#homebar").onclick = goHome;

const EMOJI_ONLY = /^(\p{Extended_Pictographic}|\p{Emoji_Component}|\u200d|\ufe0f|\s)+$/u;
function messagesHTML(c){
  const me = P(OWNER); let html = ""; let prev = null;
  c.messages.forEach((m,i) => {
    if (m.d){ html += `<div class="day">${esc(m.d)}</div>`; prev = null; return; }
    const mine = m.f === OWNER; const next = c.messages[i+1];
    const last = !next || next.d || next.f !== m.f; const first = prev !== m.f;
    html += `<div class="msg ${mine?"mine":"theirs"}${last?" last":""}${first?" gap":""}">`;
    if (!mine && c.group) html += last ? avatar(m.f,28) : `<span class="sp"></span>`;
    html += `<div class="bw">${!mine && c.group && first ? `<div class="who">${esc(P(m.f).name)}</div>` : ""}`;
    if (m.img) html += `<button class="bubble pic" data-img="${esc(m.img)}" aria-label="Open photo">${pic(m.img)}<span class="missing">📷</span></button>`;
    if (m.t){
      const emoji = EMOJI_ONLY.test(m.t) && [...m.t].length <= 6;
      const style = mine && !emoji ? `background:${me.color};color:${me.ink}` : "";
      html += `<div class="bubble${emoji?" emoji":""}" style="${style}">${esc(m.t)}</div>`;
    }
    html += `</div></div>`;
    if (m.s) html += `<div class="receipt">${esc(m.s)}</div>`;
    prev = m.f;
  });
  return html;
}

}

/* ===================== saved progress (per reader, per phone) ===================== */
const store = (() => {
  const key = "psb-" + OWNER;
  let s = {};
  try { s = JSON.parse(localStorage.getItem(key) || "{}") || {}; } catch (e) {}
  const save = () => { try { localStorage.setItem(key, JSON.stringify(s)); } catch (e) {} };
  return {
    get: (k, d) => (s[k] !== undefined ? s[k] : d),
    set: (k, v) => { s[k] = v; save(); },
    reset: () => { s = {}; try { localStorage.removeItem(key); } catch (e) {} }
  };
})();

const H2K = {}; IG_KEYS.forEach(k => { H2K[IGU(k).handle.toLowerCase()] = k; });
function rich(t){
  return esc(t).replace(/@([A-Za-z0-9._]+)/g, (m, h) => {
    const hh = h.replace(/\.+$/, ""), trail = h.slice(hh.length), k = H2K[hh.toLowerCase()];

const likeCount = p => (p.likes || []).length + (p.extra || 0) - (baseLiked(p) ? 1 : 0) + (isLiked(p) ? 1 : 0);

const followingCount = k => k !== OWNER ? IGU(k).following : IGU(k).following + IG_KEYS.reduce((n, o) => n + (o === OWNER || isFollowing(o) === defFollow(o) ? 0 : (isFollowing(o) ? 1 : -1)), 0);

/* stories */
function openStory(k, frames, title){
  frames = frames || IG.stories[k] || []; if (!frames.length) return;
  const mine = k === OWNER, h = IGU(k).handle;
  push(`<div class="sv"><div class="sv-bars">${frames.map(() => "<i><b></b></i>").join("")}</div>
    <div class="sv-head">${avatar(k, 32)}<b>${esc(title || h)}</b><small class="sv-time"></small><span class="sp1"></span><button class="ib" data-act="svclose" aria-label="Close">${ic("x")}</button></div>
    <div class="sv-media"></div>
    <button class="sv-prev" data-act="svstep" data-id="-1" aria-label="Previous"></button><button class="sv-next" data-act="svstep" data-id="1" aria-label="Next"></button>
    <div class="sv-foot">${mine ? `<span class="sv-own">Seen by ${IG_KEYS.length - 1} people</span>`
      : `<input type="text" placeholder="Reply to ${esc(h)}..." aria-label="Reply to story"><button class="ib sv-like" data-act="svlike" aria-label="Like">${ic("heart")}</button><button class="ib" data-act="svsend" aria-label="Send">${ic("send")}</button>`}</div></div>`,
    { cls: "story-view", darkStatus: true, after: v => {
      v._k = k; v._frames = frames; v._i = 0;
      v._onClose = () => { clearTimeout(v._timer); const s = store.get("seen", {}); s[k] = true; store.set("seen", s);
        document.querySelectorAll(`.ring[data-ring="${k}"]`).forEach(r => r.classList.add("seen")); };
      const inp = v.querySelector(".sv-foot input");
      if (inp){ inp.addEventListener("focus", () => { clearTimeout(v._timer); v.querySelector(".sv-bars i.run b")?.style.setProperty("animation-play-state", "paused"); });
        inp.addEventListener("keydown", e => { if (e.key === "Enter") storyReply(v); }); }
      showFrame(v);
    }});
}
function showFrame(v){
  const f = v._frames[v._i];
  v.querySelectorAll(".sv-bars i").forEach((b, j) => { b.className = j < v._i ? "done" : ""; b.innerHTML = "<b></b>"; });
  void v.offsetWidth; v.querySelectorAll(".sv-bars i")[v._i].className = "run";
  const m = v.querySelector(".sv-media"); m.setAttribute("style", photoFill({ who: f.who || v._k })); m.innerHTML = pic(f.img) + (f.text ? `<div class="sv-text">${esc(f.text)}</div>` : "");
  v.querySelector(".sv-time").textContent = f.time || "";
  clearTimeout(v._timer); v._timer = setTimeout(() => storyStep(v, 1), 5000);
}
function storyStep(v, d){
  if (topView() !== v) return;
  const n = v._i + d;
  if (n < 0){ v._i = 0; showFrame(v); return; }
  if (n >= v._frames.length){ clearTimeout(v._timer); goBack(); return; }
  v._i = n; showFrame(v);
}
function storyReply(v){
  const inp = v.querySelector(".sv-foot input"); const t = inp ? inp.value.trim() : "";
  if (!t){ toast("Type something first"); return; }
  addDM(v._k, { f: OWNER, t: `Replied to your story: ${t}` }); inp.value = ""; inp.blur();
  toast("Sent"); v._timer = setTimeout(() => storyStep(v, 1), 1200);
}

/* DMs */
function dmThreads(){
  const extra = store.get("dmx", {});
  const list = (IG.dms || []).filter(t => t.between.includes(OWNER)).map(t => ({ other: t.between.find(x => x !== OWNER), messages: t.messages }));
  Object.keys(extra).forEach(o => { if (!list.find(t => t.other === o)) list.push({ other: o, messages: [] }); });
  return list.map(t => ({ other: t.other, messages: t.messages.concat(extra[t.other] || []) }));
}
function addDM(k, msg){
  const x = store.get("dmx", {}); const cur = x[k] || [];
  if (!cur.some(m => m.d === "Today")) cur.push({ d: "Today" });
  cur.push(msg); x[k] = cur; store.set("dmx", x);
  stack.forEach(v => { if (v._dm === k) renderDM(v); });
  stack.forEach(v => { if (v._dmlist) renderDMList(v); });
}
function openDMList(){
  push(`<div class="nav">${backBtn("")}<div class="mid"><span class="nm"><b>${esc(IGU(OWNER).handle)}</b></span></div>
    <button class="ib nav-r" data-act="newdm" aria-label="New message">${ic("plus")}</button></div><div class="scroll dm-list"></div>`,
    { cls: "ig", after: v => { v._dmlist = true; renderDMList(v); } });
}
function renderDMList(v){
  const th = dmThreads();
  v.querySelector(".dm-list").innerHTML = `<div class="sect">Messages</div>` + (th.map(t => {
    const last = [...t.messages].reverse().find(m => m.t || m.img);
    return `<button class="act-row" data-act="dm" data-id="${t.other}">${igAv(t.other, 52, hasStory(t.other))}<span class="tx"><b>${esc(IGU(t.other).name)}</b><br><small>${last ? esc((last.f === OWNER ? "You: " : "") + (last.t || "📷 Photo")) : "Start a conversation"}</small></span></button>`;
  }).join("") || '<p class="empty">No messages yet. Tap + to start one.</p>');
}
function openDM(k){
  push(`<div class="nav">${backBtn("")}<div class="mid">${avatar(k, 30)}<span class="nm">${esc(IGU(k).handle)}</span></div></div>
    <div class="scroll"><div class="chat"></div></div>
    <div class="dmbox"><input type="text" maxlength="500" placeholder="Message..." aria-label="Message"><button class="post-btn" data-act="dmsend" data-id="${k}">Send</button></div>`,
    { cls: "ig", after: v => { v._dm = k; renderDM(v); } });
}
function renderDM(v){
  const k = v._dm, t = dmThreads().find(x => x.other === k) || { messages: [] };
  const head = `<div class="dm-empty">${avatar(k, 84)}<b>${esc(IGU(k).name)}</b><small>${esc(IGU(k).handle)} · ${INSTA_NAME}</small><button class="gbtn" data-act="user" data-id="${k}">View profile</button></div>`;
  v.querySelector(".chat").innerHTML = head + messagesHTML({ messages: t.messages, group: false });
  const s = v.querySelector(".scroll"); requestAnimationFrame(() => { s.scrollTop = s.scrollHeight; });
}
function sendDM(v, k){
  const inp = v.querySelector(".dmbox input"), t = inp.value.trim(); if (!t) return;
  inp.value = ""; addDM(k, { f: OWNER, t });
}

function activityHTML(){
  const items = [];
  allPosts().filter(p => p.by === OWNER).forEach(p => {
    const lk = (p.likes || []).filter(x => x !== OWNER), others = lk.length - 1 + (p.extra || 0);
    if (lk.length) items.push({ k: lk[0], p, html: `<b>${esc(IGU(lk[0]).handle)}</b>${others > 0 ? ` and ${fmt(others)} others` : ""} liked your post.` });
    commentsOf(p).filter(c => c.by !== OWNER).forEach(c => items.push({ k: c.by, p, html: `<b>${esc(IGU(c.by).handle)}</b> commented: ${rich(c.t)}` }));
  });
  allPosts().filter(p => p.by !== OWNER).forEach(p => {
    if (mentions(p.caption || "", OWNER)) items.push({ k: p.by, p, html: `<b>${esc(IGU(p.by).handle)}</b> tagged you in a post.` });
    commentsOf(p).filter(c => c.by !== OWNER && mentions(c.t, OWNER)).forEach(c => items.push({ k: c.by, p, html: `<b>${esc(IGU(c.by).handle)}</b> mentioned you: ${rich(c.t)}` }));
  });
  return items.map(it => `<div class="act-row">${igAv(it.k, 44, hasStory(it.k))}<span class="tx">${it.html} <small>${esc(it.p.time || "")}</small></span>
    <button class="th" data-act="post" data-id="${it.p.id}" style="${photoFill({ who: it.p.who || it.p.by })}" aria-label="View post">${pic(it.p.img)}</button></div>`).join("")
    || '<p class="empty">No activity yet.</p>';
}
function openActivity(){
  push(`<div class="nav">${backBtn("")}<div class="mid"><span class="nm"><b>Notifications</b></span></div></div><div class="scroll"><div class="sect">New</div>${activityHTML()}</div>`, { cls: "ig" });
}

/* ===================== MUZIK (plays YouTube links) ===================== */
const yt = { ready: false, loading: false, player: null, idx: -1, playing: false, queued: null, timer: null };
function ytId(url){ const m = String(url || "").match(/(?:youtu\.be\/|[?&]v=|\/shorts\/|\/embed\/|\/live\/)([A-Za-z0-9_-]{11})/); return m ? m[1] : ""; }
const thumb = s => { const id = ytId(s && s.youtube); return id ? `https://i.ytimg.com/vi/${id}/mqdefault.jpg` : (s && s.cover) || ""; };
const playable = () => MUSIC.songs.map((s, i) => ytId(s.youtube) ? i : -1).filter(i => i >= 0);
function loadYT(){
  if (yt.loading) return; yt.loading = true;
  window.onYouTubeIframeAPIReady = () => { yt.ready = true; if (yt.queued !== null){ const q = yt.queued; yt.queued = null; playSong(q); } };
  const s = document.createElement("script"); s.src = "https://www.youtube.com/iframe_api";
  s.onerror = () => { yt.loading = false; toast("Couldn’t connect to YouTube. Check your internet."); };
  document.head.appendChild(s);
}
function playSong(i){
  const s = MUSIC.songs[i], id = ytId(s && s.youtube);
  if (!id){ toast("This song doesn’t have a YouTube link yet."); return; }
  yt.idx = i; musicUI();
  if (!yt.ready){ yt.queued = i; loadYT(); return; }
  if (!yt.player){
    yt.player = new YT.Player("ytPlayer", { videoId: id, playerVars: { playsinline: 1, rel: 0, autoplay: 1 }, events: {
      onReady: e => { try { e.target.playVideo(); } catch (err) {} },
      onStateChange: e => { yt.playing = e.data === 1; if (e.data === 0) nextSong(1); musicUI(); },
      onError: () => { yt.playing = false; musicUI(); toast("This video can’t play here. Tap “Open in YouTube”."); }
    }});
  } else { try { yt.player.loadVideoById(id); } catch (err) {} }
  clearInterval(yt.timer); yt.timer = setInterval(tickMusic, 500);
}
function togglePlay(){
  if (!yt.player || yt.idx < 0){ const p = playable(); if (p.length) playSong(p[0]); else toast("Add YouTube links in the file first."); return; }
  try { yt.playing ? yt.player.pauseVideo() : yt.player.playVideo(); } catch (e) {}
}
function nextSong(d){
  const p = playable(); if (!p.length) return;
  const pos = p.indexOf(yt.idx); playSong(p[((pos < 0 ? 0 : pos + d) % p.length + p.length) % p.length]);
}
function shuffleSong(){ const p = playable(); if (!p.length){ toast("Add YouTube links in the file first."); return; } playSong(p[Math.floor(Math.random() * p.length)]); }
const mmss = t => { t = Math.max(0, Math.floor(t || 0)); return Math.floor(t / 60) + ":" + String(t % 60).padStart(2, "0"); };
function tickMusic(){
  if (!yt.player || !yt.player.getCurrentTime) return;
  let c = 0, d = 0; try { c = yt.player.getCurrentTime(); d = yt.player.getDuration(); } catch (e) {}
  document.querySelectorAll(".np-bar i").forEach(b => b.style.width = d ? (c / d * 100) + "%" : "0");
  document.querySelectorAll(".np-cur").forEach(x => x.textContent = mmss(c));
  document.querySelectorAll(".np-dur").forEach(x => x.textContent = d ? "-" + mmss(d - c) : "0:00");
}
function miniHTML(){
  const s = MUSIC.songs[yt.idx]; if (!s) return "";
  return `<button class="mini" data-act="nowplaying"><span class="th" style="${photoFill({ who: OWNER })}">${pic(thumb(s))}</span>
    <span class="tx"><b>${esc(s.title)}</b><small>${esc(s.artist || "")}</small></span>
    <span class="ib" data-act="playpause" role="button" aria-label="${yt.playing ? "Pause" : "Play"}">${ic(yt.playing ? "pause" : "play")}</span>
    <span class="ib" data-act="nextsong" role="button" aria-label="Next">${ic("next")}</span></button>`;
}
function musicUI(){
  document.querySelectorAll("[data-mini]").forEach(m => { m.innerHTML = miniHTML(); m.hidden = yt.idx < 0; });
  document.querySelectorAll(".song").forEach(r => { const on = +r.dataset.id === yt.idx; r.classList.toggle("now", on);
    const eq = r.querySelector(".eq"); if (eq) eq.style.display = on && yt.playing ? "inline-flex" : "none"; });
  stack.forEach(v => { if (v.classList.contains("np")) fillNP(v); });
}
function songRows(){
  return MUSIC.songs.map((s, i) => { const ok = !!ytId(s.youtube);
    return `<button class="song${ok ? "" : " off"}" data-act="song" data-id="${i}"><span class="th" style="${photoFill({ who: s.who || OWNER })}">${pic(thumb(s))}</span>
      <span class="tx"><b><span class="eq" style="display:none"><i></i><i></i><i></i></span>${esc(s.title)}</b><small>${esc(s.artist || "")}${ok ? "" : " · no link yet"}</small></span></button>`; }).join("");
}
function openMusic(){
  loadYT();
  const me = P(OWNER);
  push(`${topNav()}<div class="scroll"><div class="big-title">Music</div>
    <div class="pl-card" style="background:linear-gradient(140deg, ${me.color}, #1a1424)"><small>PLAYLIST</small><h3>${esc(MUSIC.playlist || "Favorites")}</h3><p>${esc(MUSIC.note || me.name)} · ${MUSIC.songs.length} songs</p>
      <div class="pl-btns"><button data-act="playall">${ic("play")}Play</button><button data-act="shuffle">${ic("shuffle")}Shuffle</button></div></div>
    ${songRows()}
    ${MUSIC.channel ? `<a class="chan" href="${esc(MUSIC.channel)}" target="_blank" rel="noopener"><span class="yt">${ic("play")}</span>${esc(MUSIC.channelName || "Our YouTube channel")}<span class="sp1"></span>›</a>` : '<div style="height:20px"></div>'}
    </div><div class="music-mini" data-mini hidden></div>`, { cls: "music", after: () => musicUI() });
}
function fillNP(v){
  const s = MUSIC.songs[yt.idx] || { title: "Not Playing", artist: "" }, id = ytId(s.youtube);
  v.querySelector(".np-art").innerHTML = `${pic(thumb(s))}<span>${yt.ready ? "" : "Loading YouTube player…"}</span>`;
  v.querySelector(".np-info").innerHTML = `<b>${esc(s.title)}</b><small>${esc(s.artist || "")}</small>`;
  v.querySelector(".np-pp").innerHTML = ic(yt.playing ? "pause" : "play");
  v.querySelector(".np-links").innerHTML = `${id ? `<a href="https://www.youtube.com/watch?v=${id}" target="_blank" rel="noopener">Open in YouTube</a>` : ""}${MUSIC.channel ? `<a href="${esc(MUSIC.channel)}" target="_blank" rel="noopener">${esc(MUSIC.channelName || "Our channel")}</a>` : ""}`;
}
function openNowPlaying(){
  if (yt.idx < 0) return;
  push(`<div class="nav">${backBtn("Music")}</div><div class="scroll"><div class="np-art" style="${photoFill({ who: OWNER })}"></div><div class="np-info"></div>
    <div class="np-bar" data-act="seek"><i></i></div><div class="np-times"><span class="np-cur">0:00</span><span class="np-dur">0:00</span></div>
    <div class="np-ctl"><button data-act="prevsong" aria-label="Previous">${ic("prev")}</button><button class="big np-pp" data-act="playpause" aria-label="Play or pause"></button><button data-act="nextsong" aria-label="Next">${ic("next")}</button></div>
    <div class="np-links"></div></div>`, { cls: "np music", after: v => fillNP(v) });
}
