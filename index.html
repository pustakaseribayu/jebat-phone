/* ===================== one click handler for every button above ===================== */
let lastTap = { id: null, t: 0 };
phone.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el || !phone.contains(el)) return;
  const a = el.dataset.act, id = el.dataset.id, v = el.closest(".view");
  const stop = () => { e.stopPropagation(); e.preventDefault(); };
  switch (a){
    case "galtab": v._tab = id; renderGal(v); break;
    case "photo": openPhoto(+id); break;
    case "pvstep": stepPhoto(v, +id); break;
    case "pvfav": { const f = store.get("fav", {}); f[v._i] = !f[v._i]; if (!f[v._i]) delete f[v._i]; store.set("fav", f); showPhoto(v); refreshGalleries(); toast(f[v._i] ? "Added to Favorites" : "Removed from Favorites"); break; }
    case "pvshare": friendsSheet("Send Photo", k => toast(`Sent to ${P(k).name}`)); break;
    case "pvinfo": { const p = PHOTOS[v._i]; sheet(`<div class="sh-title">Info</div><div class="sh-text">${esc(p.cap)}<small>${esc(p.when || "")} · Photo ${v._i + 1} of ${PHOTOS.length}</small></div><div class="sh-text"><small>People</small>${esc(P(p.who).name)}</div><button class="sh-cancel" data-close>Close</button>`); break; }

    case "tab": igShow(id); break;
    case "user": stop(); openProfile(id); break;
    case "post": openPost(id); break;
    case "media": { const now = Date.now();
      if (lastTap.id === id && now - lastTap.t < 350){ setLike(id, true);
        requestAnimationFrame(() => document.querySelectorAll(`.post[data-post="${id}"] .burst`).forEach(b => { b.classList.remove("pop"); void b.offsetWidth; b.classList.add("pop"); }));
        lastTap = { id: null, t: 0 }; }
      else lastTap = { id, t: now };
      break; }
    case "like": { const p = findPost(id); setLike(id, !isLiked(p)); break; }
    case "save": { const s = store.get("saved", {}); s[id] = !s[id]; if (!s[id]) delete s[id]; store.set("saved", s); refreshPost(id); toast(s[id] ? "Saved" : "Removed from saved"); break; }
    case "comments": openComments(id); break;
    case "sendcomment": sendComment(v, id); break;
    case "reply": { const inp = v.querySelector(".cbox input"); if (inp){ inp.value = "@" + IGU(id).handle + " "; inp.focus(); } break; }
    case "clike": { const c = store.get("clikes", {}); c[id] = !c[id]; if (!c[id]) delete c[id]; store.set("clikes", c); v.querySelector(".clist").innerHTML = commentsHTML(findPost(v._post)); break; }
    case "share": { const p = findPost(id); friendsSheet("Share", k => addDM(k, { f: OWNER, t: `↪ Post by @${IGU(p.by).handle}: ${p.caption || ""}` })); break; }
    case "postmore": { const p = findPost(id), saved = isSaved(p);
      const card = sheet(`<button class="sh-btn" data-x="save">${saved ? "Remove from saved" : "Save"}</button><button class="sh-btn" data-x="profile">Go to @${esc(IGU(p.by).handle)}</button><button class="sh-btn" data-x="link">Copy link</button><button class="sh-btn" data-x="share">Share to...</button><button class="sh-cancel" data-close>Cancel</button>`);
      card.querySelectorAll("[data-x]").forEach(b => b.onclick = () => { const x = b.dataset.x; closeSheet();
        if (x === "save"){ const s = store.get("saved", {}); s[id] = !saved; if (saved) delete s[id]; store.set("saved", s); refreshPost(id); toast(saved ? "Removed from saved" : "Saved"); }
        if (x === "profile") openProfile(p.by);
        if (x === "link") copyLink("Link copied");
        if (x === "share") setTimeout(() => friendsSheet("Share", k => addDM(k, { f: OWNER, t: `↪ Post by @${IGU(p.by).handle}: ${p.caption || ""}` })), 250); });
      break; }
    case "likers": { const p = findPost(id), ks = (p.likes || []).filter(k => k !== OWNER).concat(isLiked(p) ? [OWNER] : []);
      openPeople("Likes", ks, likeCount(p) - ks.length); break; }
    case "follow": { const f = store.get("follow", {}); f[id] = !isFollowing(id); store.set("follow", f);
      toast(f[id] ? `You’re now following ${IGU(id).handle}` : `Unfollowed ${IGU(id).handle}`);
      document.querySelectorAll(`[data-act="follow"][data-id="${id}"]`).forEach(b => { const on = f[id]; b.textContent = on ? "Following" : "Follow";
        if (b.classList.contains("fbtn")) b.classList.toggle("ghost", on); else b.classList.toggle("blue", !on); });
      document.querySelectorAll(`.prof[data-prof]`).forEach(pb => { const st = pb.querySelectorAll(".stats b"); const k = pb.dataset.prof; st[1].textContent = fmt(followerCount(k)); st[2].textContent = fmt(followingCount(k)); });
      break; }
    case "followers": openPeople("Followers", IG_KEYS.filter(k => k !== id), followerCount(id) - (IG_KEYS.length - 1)); break;
    case "following": openPeople("Following", IG_KEYS.filter(k => k !== id && (id !== OWNER || isFollowing(k))), followingCount(id) - (id === OWNER ? IG_KEYS.filter(k => k !== OWNER && isFollowing(k)).length : IG_KEYS.length - 1)); break;
    case "ptab": { const pr = el.closest(".prof"); pr.querySelectorAll(".ptabs button").forEach(b => b.classList.toggle("on", b === el)); pr.querySelectorAll("[data-pt]").forEach(g => g.hidden = g.dataset.pt !== id); break; }
    case "story": stop(); openStory(id); break;
    case "highlight": { const [k, i] = id.split(":"); const h = IGU(k).highlights[+i]; openStory(k, h.frames, h.title); break; }
    case "svclose": goBack(); break;
    case "svstep": storyStep(v, +id); break;
    case "svlike": el.classList.toggle("on"); if (el.classList.contains("on")) toast("You liked this story"); break;
    case "svsend": storyReply(v); break;
    case "activity": openActivity(); break;
    case "dms": openDMList(); break;
    case "dm": stop(); openDM(id); break;
    case "dmsend": sendDM(v, id); break;
    case "newdm": { const card = sheet(`<div class="sh-title">New message</div>${IG_KEYS.filter(k => k !== OWNER).map(k => `<button class="act-row" data-to="${k}">${igAv(k, 40)}<span class="tx"><b>${esc(IGU(k).name)}</b><br><small>${esc(IGU(k).handle)}</small></span></button>`).join("")}<button class="sh-cancel" data-close>Cancel</button>`);
      card.querySelectorAll("[data-to]").forEach(b => b.onclick = () => { closeSheet(); openDM(b.dataset.to); }); break; }
    case "usermore": { const k = id; const card = sheet(`<button class="sh-btn" data-x="link">Copy profile link</button><button class="sh-btn" data-x="share">Share this profile</button><button class="sh-btn" data-x="dm">Send message</button><button class="sh-cancel" data-close>Cancel</button>`);
      card.querySelectorAll("[data-x]").forEach(b => b.onclick = () => { const x = b.dataset.x; closeSheet();
        if (x === "link") copyLink("Profile link copied");
        if (x === "share") setTimeout(() => friendsSheet("Share Profile", o => addDM(o, { f: OWNER, t: `↪ Profile: @${IGU(k).handle}` })), 250);
        if (x === "dm") openDM(k); }); break; }
    case "compose": openCompose(); break;
    case "pick": pickPhoto(v, +id); break;
    case "publish": publish(v); break;
    case "editprofile": { const card = sheet(`<div class="sh-title">Edit bio</div><textarea class="sh-area" maxlength="150">${esc(bioOf(OWNER))}</textarea><button class="sh-btn" data-x="save" style="color:#4f8ef7;font-weight:600;text-align:center">Save</button><button class="sh-cancel" data-close>Cancel</button>`);
      card.querySelector("[data-x]").onclick = () => { store.set("bio", card.querySelector("textarea").value.trim()); closeSheet(); refreshIG(); toast("Profile updated"); }; break; }
    case "shareprofile": copyLink("Profile link copied"); break;
    case "profmenu": { const card = sheet(`<button class="sh-btn" data-x="saved">Saved</button><button class="sh-btn" data-x="act">Your activity</button><button class="sh-btn red" data-x="reset">Reset this phone</button><button class="sh-cancel" data-close>Cancel</button>`);
      card.querySelectorAll("[data-x]").forEach(b => b.onclick = () => { const x = b.dataset.x; closeSheet();
        if (x === "saved"){ const sv = allPosts().filter(isSaved); push(`<div class="nav">${backBtn("")}<div class="mid"><span class="nm"><b>Saved</b></span></div></div><div class="scroll"><div class="grid3">${sv.map(tileHTML).join("") || '<p class="empty" style="grid-column:1/-1">Tap the save icon on a post to keep it here.</p>'}</div></div>`, { cls: "ig" }); }
        if (x === "act") openActivity();
        if (x === "reset" && confirm("Erase all the likes, comments, posts and messages you added on this phone?")){ store.reset(); refreshIG(); refreshGalleries(); toast("Phone reset"); } }); break; }
    case "noop": break;

    case "song": playSong(+id); break;
    case "playall": { const p = playable(); if (p.length) playSong(p[0]); else toast("Add YouTube links in the file first."); break; }
    case "shuffle": shuffleSong(); break;
    case "playpause": stop(); togglePlay(); break;
    case "nextsong": stop(); nextSong(1); break;
    case "prevsong": nextSong(-1); break;
    case "nowplaying": openNowPlaying(); break;
    case "seek": { if (!yt.player || !yt.player.getDuration) break; const r = el.getBoundingClientRect(); try { yt.player.seekTo(yt.player.getDuration() * Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)), true); } catch (err) {} break; }
  }
});
phone.addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  const v = e.target.closest(".view"); if (!v) return;
  if (e.target.closest(".cbox")){ e.preventDefault(); sendComment(v, v._post); }
  if (e.target.closest(".dmbox")){ e.preventDefault(); sendDM(v, v._dm); }
});


/* ===================== PHONE ===================== */
const TI = {
  star: '<path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.1l-5.7 3.2 1.2-6.4-4.7-4.4 6.4-.8z"/>',
  clock: '<path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm.9 10.4V6.5h-1.8v6.6l4.6 2.8.9-1.5z"/>',
  person: '<path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 4.2a3.4 3.4 0 1 1 0 6.8 3.4 3.4 0 0 1 0-6.8zm0 13.8a8 8 0 0 1-6.2-2.9c1.4-1.8 3.7-2.7 6.2-2.7s4.8.9 6.2 2.7A8 8 0 0 1 12 20z"/>',
  grid9: '<circle cx="5.5" cy="4.5" r="2"/><circle cx="12" cy="4.5" r="2"/><circle cx="18.5" cy="4.5" r="2"/><circle cx="5.5" cy="11" r="2"/><circle cx="12" cy="11" r="2"/><circle cx="18.5" cy="11" r="2"/><circle cx="5.5" cy="17.5" r="2"/><circle cx="12" cy="17.5" r="2"/><circle cx="18.5" cy="17.5" r="2"/><circle cx="12" cy="22" r="1.6"/>',
  vm: '<path d="M6.5 7.5a4.5 4.5 0 0 0-1.2 8.8h13.4a4.5 4.5 0 1 0-4-2.5H10a4.5 4.5 0 0 0-3.5-6.3zm0 2a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5zm11 0a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5z"/>',
  call: '<path d="M6.6 10.8a15 15 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/>',
  msg: '<path d="M12 3C6.5 3 2 6.7 2 11.2c0 2.6 1.5 4.9 3.9 6.4-.2 1.3-.9 2.6-2 3.4 2 0 3.8-.7 5-1.8 1 .3 2 .4 3.1.4 5.5 0 10-3.7 10-8.3S17.5 3 12 3z"/>',
  video: '<path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h10A1.5 1.5 0 0 1 16 6.5v11a1.5 1.5 0 0 1-1.5 1.5h-10A1.5 1.5 0 0 1 3 17.5zM17 10l4-2.5v9L17 14z"/>',
  mail: '<path d="M3 5h18a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm1.5 2v.3L12 12l7.5-4.7V7z"/>',
  mute: '<path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3zM5 11h2a5 5 0 0 0 10 0h2a7 7 0 0 1-6 6.9V21h-2v-3.1A7 7 0 0 1 5 11z"/><path d="M3 3l18 18" stroke="#fff" stroke-width="0"/>',
  speaker: '<path d="M3 9h4l5-4v14l-5-4H3zM15.5 8.5a5 5 0 0 1 0 7l-1.4-1.4a3 3 0 0 0 0-4.2zM18.3 5.7a9 9 0 0 1 0 12.6l-1.4-1.4a7 7 0 0 0 0-9.8z"/>',
  add: '<path d="M11 4h2v7h7v2h-7v7h-2v-7H4v-2h7z"/>',
  out: '<path d="M14 3h7v7h-2V6.4l-7.3 7.3-1.4-1.4L17.6 5H14zM5 5h6v2H7v10h10v-4h2v6H5z"/>',
  play: '<path d="M7 4.5v15l13-7.5z"/>', pause: '<rect x="6" y="4.5" width="4" height="15" rx="1"/><rect x="14" y="4.5" width="4" height="15" rx="1"/>'
};
const ti = n => `<svg viewBox="0 0 24 24" fill-rule="evenodd" aria-hidden="true">${TI[n]}</svg>`;
const telName = k => (P(k).name || k);
const missedTotal = () => (CALLS.recents || []).filter(r => r.type === "missed").reduce((n, r) => n + (r.count || 1), 0);
const vmList = () => (CALLS.voicemails || []).filter((v, i) => !store.get("vmdel", {})[i]).map(v => v);
const vmUnheard = () => (CALLS.voicemails || []).filter((v, i) => !store.get("vmdel", {})[i] && !store.get("vmheard", {})[i]).length;
function phoneBadge(){
  const n = store.get("missedSeen", false) ? 0 : missedTotal();
  document.querySelectorAll('[data-app="telefon"]').forEach(a => { let b = a.querySelector(".badge");
    if (!n){ if (b) b.remove(); return; }
    if (!b){ b = document.createElement("b"); b.className = "badge"; a.prepend(b); } b.textContent = n; });
}
phoneBadge();

let telRoot = null;
function openPhone(tab){
  push(`<div class="nav">${backBtn("Home")}</div><div class="scroll tel-body"></div>
    <nav class="tel-tabs">${[["fav","Favorites","star"],["rec","Recents","clock"],["con","Contacts","person"],["key","Keypad","grid9"],["vm","Voicemail","vm"]].map(([id, l, i]) =>
      `<button data-act="teltab" data-id="${id}">${ti(i)}${l}${id === "vm" && vmUnheard() ? `<b class="badge">${vmUnheard()}</b>` : ""}</button>`).join("")}</nav>`,
    { cls: "tel", after: v => { telRoot = v; v._onClose = () => { telRoot = null; }; telShow(tab || "rec"); } });
}
function telShow(tab){
  if (!telRoot) return;
  telRoot._tab = tab; const body = telRoot.querySelector(".tel-body");
  telRoot.querySelectorAll(".tel-tabs button").forEach(b => b.classList.toggle("on", b.dataset.id === tab));
  if (tab === "fav") body.innerHTML = `<div class="big-title">Favorites</div>` + ((CALLS.favorites || []).map(k =>
      `<div class="trow"><button class="nm" style="display:flex;align-items:center;gap:12px;text-align:left" data-act="dial" data-id="${k}">${avatar(k,40)}<span class="tx" style="border:0"><span class="nm"><b>${esc(telName(k))}</b><small>mobile</small></span></span></button><button class="info" data-act="contact" data-id="${k}" aria-label="Info">i</button></div>`).join("") || '<p class="empty">No Favorites</p>');
  if (tab === "rec"){ store.set("missedSeen", true); phoneBadge(); renderRecents(body, telRoot._recSeg || "all"); }
  if (tab === "con") body.innerHTML = contactsHTML();
  if (tab === "key"){ telRoot._num = telRoot._num || ""; body.innerHTML = keypadHTML(telRoot._num); }
  if (tab === "vm") body.innerHTML = vmHTML();
  body.scrollTop = 0;
}
function renderRecents(body, seg){
  telRoot._recSeg = seg;
  const rows = (CALLS.recents || []).filter(r => seg === "all" || r.type === "missed");
  body.innerHTML = `<div class="big-title">Recents</div><div class="seg2"><button class="${seg === "all" ? "on" : ""}" data-act="recseg" data-id="all">All</button><button class="${seg === "missed" ? "on" : ""}" data-act="recseg" data-id="missed">Missed</button></div>` +
    (rows.map(r => `<div class="trow"><button style="flex:1;min-width:0;display:flex;gap:10px;align-items:center;text-align:left" data-act="dial" data-id="${r.who}">
      <span class="tx"><span class="nm"><b class="${r.type === "missed" ? "miss" : ""}">${esc(telName(r.who))}${(r.count || 1) > 1 ? ` (${r.count})` : ""}</b>
      <small>${r.type === "out" ? ti("out") : ""}${r.video ? "FaceTime Video" : "mobile"}</small></span><span class="when">${esc(r.when || "")}</span></span></button>
      <button class="info" data-act="contact" data-id="${r.who}" aria-label="Info">i</button></div>`).join("") || '<p class="empty">No Missed Calls</p>');
}
function contactsHTML(){
  const keys = Object.keys(PEOPLE).filter(k => k !== OWNER && !(PEOPLE[k].hidden)).sort((a, b) => telName(a).localeCompare(telName(b)));
  let html = `<div class="big-title">Contacts</div><button class="mycard" data-act="contact" data-id="${OWNER}">${avatar(OWNER, 56)}<span><b>${esc(telName(OWNER))}</b><small>My Card</small></span></button>`, last = "";
  keys.forEach(k => { const L = telName(k)[0].toUpperCase(); if (L !== last){ html += `<div class="letter">${esc(L)}</div>`; last = L; }
    html += `<button class="trow" data-act="contact" data-id="${k}"><span class="tx" style="padding:8px 0 12px"><span class="nm"><b style="font-weight:500">${esc(telName(k))}</b></span></span></button>`; });
  return html;
}
const KL = ["","ABC","DEF","GHI","JKL","MNO","PQRS","TUV","WXYZ"];
function keypadHTML(num){
  return `<div class="kp"><div class="kp-num">${esc(num)}</div><div class="kp-grid">${[1,2,3,4,5,6,7,8,9].map(n => `<button data-act="kp" data-id="${n}">${n}<small>${KL[n-1]}</small></button>`).join("")}
    <button data-act="kp" data-id="*">*</button><button data-act="kp" data-id="0">0<small>+</small></button><button data-act="kp" data-id="#">#</button></div>
    <div class="kp-row"><span></span><button class="callbtn" data-act="kpcall" aria-label="Call">${ti("call")}</button>${num ? '<button class="kp-del" data-act="kpdel" aria-label="Delete">⌫</button>' : "<span></span>"}</div></div>`;
}
function vmHTML(){
  const del = store.get("vmdel", {}), heard = store.get("vmheard", {}), open = telRoot._vmOpen;
  const items = (CALLS.voicemails || []).map((v, i) => ({ v, i })).filter(x => !del[x.i]);
  return `<div class="big-title">Voicemail</div>` + (items.map(({ v, i }) => `<div class="vm">
    <button class="trow" data-act="vmopen" data-id="${i}"><span class="tx"><span class="nm"><b>${heard[i] ? "" : '<span style="color:#007aff">● </span>'}${esc(telName(v.who))}</b><small>${esc(v.when || "")}</small></span><span class="when">${esc(v.dur || "")}</span></span></button>
    ${open === i ? `<div class="vm-body"><div class="vm-t"><small>TRANSCRIPTION</small>${esc(v.text || "")}</div>
      <div class="vm-ctl"><button class="vm-play" data-act="vmplay" data-id="${i}" aria-label="Play">${ti("play")}</button><span class="vm-bar"><i></i></span><span class="vm-time">${esc(v.dur || "0:00")}</span></div>
      <div class="vm-acts"><button data-act="dial" data-id="${v.who}">Call Back</button><button data-act="contact" data-id="${v.who}">Contact</button><span class="sp1"></span><button class="red" data-act="vmdel" data-id="${i}">Delete</button></div></div>` : ""}
  </div>`).join("") || '<p class="empty">No Voicemail</p>');
}
let vmAudio = null, vmTimer = null;
function stopVM(){ if (vmAudio){ try { vmAudio.pause(); } catch (e) {} vmAudio = null; } clearInterval(vmTimer); vmTimer = null; }
function playVM(i, btn){
  const v = CALLS.voicemails[i]; const bar = btn.parentElement.querySelector(".vm-bar i"), time = btn.parentElement.querySelector(".vm-time");
  if (vmTimer || vmAudio){ stopVM(); btn.innerHTML = ti("play"); return; }
  const h = store.get("vmheard", {}); h[i] = true; store.set("vmheard", h);
  const parts = String(v.dur || "0:20").split(":"); const total = (+parts[0]) * 60 + (+parts[1] || 0);
  btn.innerHTML = ti("pause");
  if (v.audio){ vmAudio = new Audio(encodeURI(v.audio)); vmAudio.play().catch(() => toast("Can’t play this recording"));
    vmTimer = setInterval(() => { if (!vmAudio) return; const d = vmAudio.duration || total; bar.style.width = (vmAudio.currentTime / d * 100) + "%"; time.textContent = mmss(d - vmAudio.currentTime);
      if (vmAudio.ended){ stopVM(); btn.innerHTML = ti("play"); bar.style.width = "0"; time.textContent = v.dur; } }, 250); return; }
  let t = 0; vmTimer = setInterval(() => { t += .25; bar.style.width = Math.min(100, t / total * 100) + "%"; time.textContent = mmss(total - t);
    if (t >= total){ stopVM(); btn.innerHTML = ti("play"); bar.style.width = "0"; time.textContent = v.dur; } }, 250);
}
function openContact(k){
  const p = P(k), chat = CHATS.find(c => c.with === k);
  push(`<div class="nav">${backBtn("Back")}</div><div class="scroll"><div class="ccard">${avatar(k, 96)}<h3>${esc(telName(k))}</h3>
    ${k === OWNER ? "" : `<div class="cacts"><button data-act="cmsg" data-id="${k}">${ti("msg")}message</button><button data-act="dial" data-id="${k}">${ti("call")}call</button><button data-act="facetime" data-id="${k}">${ti("video")}video</button><button data-act="cmail" data-id="${k}">${ti("mail")}mail</button></div>`}
    <div class="cfield"><small>mobile</small><span>${esc(p.phone || "•••• ••• ••••")}</span></div>
    ${p.note ? `<div class="cfield"><small>Notes</small><p>${esc(p.note)}</p></div>` : ""}
    ${k !== OWNER && chat ? `<button class="cfield" data-act="cmsg" data-id="${k}"><span>Send Message</span></button>` : ""}
    ${k !== OWNER && (CALLS.favorites || []).includes(k) ? `<div class="cfield"><span style="color:var(--muted)">In Favorites</span></div>` : ""}
  </div></div>`, { cls: "tel" });
}
function startCall(who, video){
  const label = who && PEOPLE[who] ? telName(who) : (who || "Unknown");
  push(`<div class="call-top">${who && PEOPLE[who] ? avatar(who, 96) : '<span class="av" style="width:96px;height:96px;background:#6b6578;color:#fff;font-size:40px">#</span>'}<h3>${esc(label)}</h3><p class="call-st">${video ? "FaceTime Video…" : "calling mobile…"}</p></div>
    <div class="call-grid">
      <button data-act="ctog"><span>${ti("mute")}</span>mute</button><button data-act="ckp"><span>${ti("grid9")}</span>keypad</button><button data-act="ctog"><span>${ti("speaker")}</span>audio</button>
      <button data-act="cnote" data-id="Add call"><span>${ti("add")}</span>add call</button><button data-act="ctog"><span>${ti("video")}</span>FaceTime</button><button data-act="cnote" data-id="Contacts"><span>${ti("person")}</span>contacts</button></div>
    <div class="call-kp">${[1,2,3,4,5,6,7,8,9,"*",0,"#"].map(n => `<button data-act="ctone">${n}</button>`).join("")}</div>
    <button class="endbtn" data-act="endcall" aria-label="End call">${ti("call")}</button>`,
    { cls: "call", darkStatus: true, after: v => {
      v.style.display = "flex"; v.style.flexDirection = "column";
      const st = v.querySelector(".call-st");
      v._t1 = setTimeout(() => { st.textContent = "ringing…"; }, 2500);
      v._t2 = setTimeout(() => { st.textContent = "No Answer"; v._t3 = setTimeout(() => { if (topView() === v) goBack(); }, 1600); }, 11000);
      v._onClose = () => { clearTimeout(v._t1); clearTimeout(v._t2); clearTimeout(v._t3); };
    }});
}
phone.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el || !phone.contains(el)) return;
  const a = el.dataset.act, id = el.dataset.id, v = el.closest(".view");
  switch (a){
    case "teltab": stopVM(); telShow(id); break;
    case "recseg": renderRecents(v.querySelector(".tel-body"), id); break;
    case "dial": e.stopPropagation(); startCall(id); break;
    case "contact": e.stopPropagation(); openContact(id); break;
    case "kp": if ((v._num || "").length < 15){ v._num = (v._num || "") + id; v.querySelector(".tel-body").innerHTML = keypadHTML(v._num); } break;
    case "kpdel": v._num = (v._num || "").slice(0, -1); v.querySelector(".tel-body").innerHTML = keypadHTML(v._num); break;
    case "kpcall": if (v._num) startCall(v._num); else toast("Type a number first"); break;
    case "vmopen": { stopVM(); const i = +id; telRoot._vmOpen = telRoot._vmOpen === i ? null : i; v.querySelector(".tel-body").innerHTML = vmHTML(); break; }
    case "vmplay": playVM(+id, el); break;
    case "vmdel": { stopVM(); const d = store.get("vmdel", {}); d[id] = true; store.set("vmdel", d); telRoot._vmOpen = null; v.querySelector(".tel-body").innerHTML = vmHTML(); toast("Voicemail deleted"); break; }
    case "cmsg": { const chat = CHATS.find(c => c.with === id); if (chat) openChat(chat.id); else toast(`No messages with ${telName(id)}`); break; }
    case "facetime": startCall(id, true); break;
    case "cmail": toast(`No email saved for ${telName(id)}`); break;
    case "ctog": el.classList.toggle("on"); break;
    case "ckp": v.classList.add("kpon"); break;
    case "ctone": break;
    case "cnote": toast(`${id} isn’t available during this call`); break;
    case "endcall": goBack(); break;
  }
});
// tapping outside the in-call keypad brings the buttons back
phone.addEventListener("click", e => { const v = e.target.closest(".view.call.kpon"); if (v && !e.target.closest(".call-kp") && !e.target.closest('[data-act="ckp"]')) v.classList.remove("kpon"); });

/* swipe from the left edge to go back, like iPhone */
(() => {
  let sx = null, sy = 0, done = false;
  phone.addEventListener("touchstart", e => { const r = phone.getBoundingClientRect(), t = e.touches[0];
    sx = (t.clientX - r.left < 24 && stack.length) ? t.clientX : null; sy = t.clientY; done = false; }, { passive: true });
  phone.addEventListener("touchmove", e => { if (sx === null || done) return; const t = e.touches[0];
    if (t.clientX - sx > 70 && Math.abs(t.clientY - sy) < 60){ done = true; goBack(); } }, { passive: true });
  phone.addEventListener("touchend", () => { sx = null; }, { passive: true });
})();

</script>
